# Render Blueprint
# 文档: https://render.com/docs/blueprint-spec
#
# 重要：Free 实例没有持久磁盘，重启/重部署会清空生成历史与图片。
# 需要保留数据时请用 starter（或更高）并挂载 disk（如下配置）。
services:
  - type: web
    name: banana
    runtime: node
    # free 不支持 disk；要持久化请保持 starter
    plan: starter
    region: singapore
    buildCommand: "npm run build"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    disk:
      name: banana-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: JWMP_BASE_URL
        value: https://kwjm.com
      - key: JWMP_API_KEY
        sync: false
      - key: JWMP_MODEL_PRO
        value: gemini-3-pro-image-preview-hq
      - key: JWMP_MODEL_NANO2
        value: gemini-3.1-flash-image-preview-hq
      # 数据写入持久盘（与上面 mountPath 一致）
      - key: DATA_DIR
        value: /var/data
