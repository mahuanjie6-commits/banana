# Render Blueprint
# 推荐：Free + Cloudflare R2（环境变量填 R2_*，无需挂盘）
# 备选：Starter + disk + DATA_DIR（不配 R2 时）
services:
  - type: web
    name: banana
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install --omit=dev"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: JWMP_BASE_URL
        value: https://kwjm.com
      - key: JWMP_API_KEY
        sync: false
      - key: JWMP_MODEL_PRO
        value: gemini-3-pro-image-preview-hq
      - key: JWMP_MODEL_NANO2
        value: gemini-3.1-flash-image-preview-hq
      # Cloudflare R2（控制台填真实值；四个都配齐才启用）
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
